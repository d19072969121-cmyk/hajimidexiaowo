# ╔══════════════════════════════════════════════════════════════════╗
# ║  二创仓库 Android APK 出包（自包含）                            ║
# ╠══════════════════════════════════════════════════════════════════╣
# ║                                                                ║
# ║  与上游 rebuild-android.yml + reusable-build-android.yml 的    ║
# ║  差异与理由见 build/ci/PLAN.md。核心原则：                     ║
# ║                                                                ║
# ║   - 不依赖任何 GitHub Secret（走 --dev 自签，keystore 现场生成）║
# ║   - 不依赖上游 Release / R2 桶 / Cloudflare CDN                ║
# ║   - 不调用 release-contracts.mjs（其 identity() 断言六处版本    ║
# ║     号 + 两个 lockfile SHA256 完全自洽，二创分支必然失败）      ║
# ║   - NDK 工具链按 uname 动态解析宿主 tag，并校验 ELF 架构        ║
# ║                                                                ║
# ║  产品注入逻辑（权限 / adjustResize / MainActivity /            ║
# ║  SafPermissionPlugin / ApkInstallerPlugin / FileProvider /     ║
# ║  pdfium）逐字保留自上游 reusable-build-android.yml，因为缺失    ║
# ║  会让 APK 静默功能回归。                                       ║
# ║                                                                ║
# ║  操作: GitHub → Actions → DIY Android APK → Run workflow       ║
# ╚══════════════════════════════════════════════════════════════════╝

name: DIY Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '构建代码来源 (分支/tag/commit SHA)，留空则使用当前触发 ref'
        required: false
        default: ''
        type: string
      version:
        description: '产物命名用版本号 (如 0.9.73)，留空则从 package.json 读取'
        required: false
        default: ''
        type: string
      build_debug:
        description: '产出 debug 变体 (体积更大、启动更慢，仅用于问题定位)'
        required: false
        default: false
        type: boolean

concurrency:
  group: diy-android-${{ github.ref }}
  cancel-in-progress: false

# 本工作流不写仓库：无 Release 操作、无 push。只读权限即可。
permissions:
  contents: read

env:
  # NDK 版本：与上游 reusable-build-android.yml:165 保持一致。该版本由
  # sdkmanager 从 Google 官方仓库解析，上游持续在用，属已验证可用值。
  NDK_VERSION: '29.0.13846066'
  BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_PLATFORM: 'android-36'

jobs:
  resolve:
    name: Resolve build inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve immutable source SHA and version
        id: resolve
        run: |
          SHA=$(git rev-parse HEAD)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve source SHA"; exit 1; }

          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::invalid version '${VERSION}'. Expected X.Y.Z"; exit 1; }

          echo "source_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "## DIY Android build inputs"
            echo "- source SHA: \`${SHA}\`"
            echo "- version: \`${VERSION}\`"
            echo "- debug variant: \`${{ inputs.build_debug }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✅ building ${VERSION} from ${SHA}"

  build:
    name: Build APK (aarch64)
    needs: [resolve]
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    env:
      # vite build 峰值 RSS ~4.45GB（含 demo/hero MPA 双入口）。4GB 上限已
      # 在上游 rebuild 路径反复 OOM（exit 134）。runner 7GB RAM，此 job 内
      # 前端构建独占内存，故堆上限提到 6GB。
      NODE_OPTIONS: '--max-old-space-size=6144'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 'z'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      # Android 链接期峰值高；7GB runner 上 4 路并行会触发 runner service
      # 被 OOM 杀掉（"shutdown signal"）。压到 2 路。
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.source_sha }}

      # 与上游 Prepare Android project 步骤的注入目标保持一致（见文件头说明）。
      - name: Verify managed Android sources are present
        run: |
          MISSING=""
          for FILE in \
            src-tauri/mobile/android/MainActivity.kt \
            src-tauri/mobile/android/SafPermissionPlugin.kt \
            src-tauri/mobile/android/ApkInstallerPlugin.kt \
            src-tauri/mobile/android/res/xml/file_paths.xml \
            src-tauri/resources/pdfium/libpdfium_android_arm64.so; do
            [ -f "$FILE" ] || MISSING="${MISSING} ${FILE}"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::required build sources are missing:${MISSING}"
            exit 1
          fi
          echo "✅ all managed Android sources present"

      - name: Free disk space
        run: |
          echo "=== Disk usage BEFORE cleanup ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/graalvm \
            /usr/local/lib/node_modules \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/Ruby
          sudo docker image prune --all --force || true
          echo "=== Disk usage AFTER cleanup ==="
          df -h /

      # 上游在这里跑 prepare-linux-release.sh 扩 swap。该脚本要求 swap 路径的
      # 父目录 /mnt 存在且可写，并对 RAM/磁盘做硬断言；在自包含场景下它引入
      # 的失败面大于收益，故去掉。CARGO_BUILD_JOBS=2 已作更直接的 OOM 缓解。
      - name: Report runner capacity
        run: |
          echo "=== runner capacity ==="
          free -h
          nproc
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found at $SDKMANAGER"; exit 1; }
          yes | "$SDKMANAGER" \
            "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" "platforms;${ANDROID_PLATFORM}" | tail -3
          NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          test -d "$NDK_HOME" || { echo "::error::NDK install directory missing: $NDK_HOME"; exit 1; }
          echo "NDK_HOME=${NDK_HOME}" >> "$GITHUB_ENV"
          echo "✅ NDK installed: ${NDK_HOME}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.98.1'
          targets: aarch64-linux-android

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # --locked 会因 lockfile 与 manifest 的任何细微漂移而失败。二创分支
      # 不接受这种与产物正确性无关的失败。改用 cargo metadata 做真实自洽校验。
      - name: Verify Cargo dependency graph resolves
        run: (cd src-tauri && cargo metadata --format-version 1 > /dev/null)

      - name: Print build tool manifest
        run: |
          echo "=== Android build tool manifest ==="
          echo "node            : $(node --version)"
          echo "npm             : $(npm --version)"
          echo "rustc           : $(rustc --version)"
          echo "cargo           : $(cargo --version)"
          echo "java            : $(java -version 2>&1 | head -1)"
          echo "ndk             : ${NDK_VERSION} (pinned, matches upstream)"
          echo "build-tools     : ${BUILD_TOOLS_VERSION} (pinned)"
          echo "platform        : ${ANDROID_PLATFORM} (pinned)"
          echo "features        : mobile-slim --no-default-features"
          echo "release profile : opt-level=z / cgu=16 / lto=false"

      - name: Generate version info
        run: node scripts/generate-version.mjs

      # ── 前端构建（二创修正：上游依赖 FRONTEND_DIST_ARTIFACT 预构建产物，
      #    DIY 版既无该 artifact、又无 vite build 步骤，属遗漏）──
      # 为何直接跑 vite 而不是 npm run build：
      #   npm run build 会触发 package.json 的 prebuild
      #   (version:generate + licenses:check + typecheck)。typecheck 在
      #   CI runner 上额外吃 2-3GB 堆（本机实测 4GB 上限才通过），而
      #   6144MB 堆要与 Rust/Gradle 共享同 runner，叠加会显著抬高 OOM 概率。
      #   version:generate 已在上一 step 单独跑过；licenses:check 与产物
      #   正确性无关，不应成为出包阻断点（与上方去掉 --locked 同一取舍）。
      # 为何不能省：dist/ 被 .gitignore:70,138 忽略（git ls-files dist/ = 0），
      #   干净 runner 上不存在；tauri.conf.json:7 的 frontendDist="../dist"
      #   在无 dist 时必然失败。虽 beforeBuildCommand="npm run build" 理论上
      #   会兜底重建，但那是上述高内存路径，故显式前置构建并让 Tauri 跳过重建。
      - name: Build frontend (vite)
        run: npx vite build

      - name: Verify frontend artifact exists
        run: |
          test -f dist/index.html \
            || { echo "::error::dist/index.html missing after vite build"; exit 1; }
          echo "✅ dist/index.html present ($(du -sh dist | cut -f1))"

      - name: Initialize Android project
        run: npx tauri android init

      # ── 以下注入逻辑逐字保留自上游 reusable-build-android.yml:260-322 ──
      # 与 scripts/build_android.sh 的 inject_android_permissions /
      # inject_android_soft_input_mode / sync_main_activity /
      # sync_apk_installer_files / inject_apk_file_provider 保持一致。
      # 缺失即硬失败，防止 APK 静默功能回归。
      - name: Prepare Android project (permissions / soft input / MainActivity)
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST" || { echo "::error::AndroidManifest.xml not found at $MANIFEST"; exit 1; }

          for PERMISSION in android.permission.RECORD_AUDIO android.permission.MODIFY_AUDIO_SETTINGS android.permission.POST_NOTIFICATIONS android.permission.REQUEST_INSTALL_PACKAGES; do
            PERM_LINE="<uses-permission android:name=\"$PERMISSION\" />"
            if ! grep -qF "$PERMISSION" "$MANIFEST"; then
              sed -i "/<manifest/a\\    $PERM_LINE" "$MANIFEST"
            fi
            grep -qF "$PERMISSION" "$MANIFEST" || { echo "::error::failed to inject $PERMISSION"; exit 1; }
            echo "✅ permission present: $PERMISSION"
          done

          if ! grep -qF 'android:windowSoftInputMode' "$MANIFEST"; then
            sed -i 's|android:launchMode="singleTask"|android:launchMode="singleTask" android:windowSoftInputMode="adjustResize"|' "$MANIFEST"
          fi
          grep -qF 'android:windowSoftInputMode="adjustResize"' "$MANIFEST" || { echo "::error::failed to inject windowSoftInputMode=adjustResize"; exit 1; }
          echo "✅ windowSoftInputMode=adjustResize present"

          SRC="src-tauri/mobile/android/MainActivity.kt"
          DST="src-tauri/gen/android/app/src/main/java/com/aistudy/app/MainActivity.kt"
          test -f "$SRC" || { echo "::error::managed MainActivity.kt missing at $SRC"; exit 1; }
          test -d "$(dirname "$DST")" || { echo "::error::generated Android java dir missing at $(dirname "$DST")"; exit 1; }
          cp "$SRC" "$DST"
          cmp -s "$SRC" "$DST" || { echo "::error::MainActivity.kt sync verification failed"; exit 1; }
          echo "✅ MainActivity.kt synced from managed copy"

          SRC="src-tauri/mobile/android/SafPermissionPlugin.kt"
          DST="src-tauri/gen/android/app/src/main/java/com/aistudy/app/SafPermissionPlugin.kt"
          test -f "$SRC" || { echo "::error::managed SafPermissionPlugin.kt missing at $SRC"; exit 1; }
          cp "$SRC" "$DST"
          cmp -s "$SRC" "$DST" || { echo "::error::SafPermissionPlugin.kt sync verification failed"; exit 1; }
          echo "✅ SafPermissionPlugin.kt synced from managed copy"

          SRC="src-tauri/mobile/android/ApkInstallerPlugin.kt"
          DST="src-tauri/gen/android/app/src/main/java/com/aistudy/app/ApkInstallerPlugin.kt"
          test -f "$SRC" || { echo "::error::managed ApkInstallerPlugin.kt missing at $SRC"; exit 1; }
          cp "$SRC" "$DST"
          cmp -s "$SRC" "$DST" || { echo "::error::ApkInstallerPlugin.kt sync verification failed"; exit 1; }
          echo "✅ ApkInstallerPlugin.kt synced from managed copy"

          SRC="src-tauri/mobile/android/res/xml/file_paths.xml"
          DST="src-tauri/gen/android/app/src/main/res/xml/file_paths.xml"
          test -f "$SRC" || { echo "::error::managed file_paths.xml missing at $SRC"; exit 1; }
          mkdir -p "$(dirname "$DST")"
          cp "$SRC" "$DST"
          cmp -s "$SRC" "$DST" || { echo "::error::file_paths.xml sync verification failed"; exit 1; }
          echo "✅ file_paths.xml synced from managed copy"

          if ! grep -qF 'androidx.core.content.FileProvider' "$MANIFEST"; then
            # ${applicationId} 是 manifest placeholder（gradle 构建时替换），
            # 用单引号防止 shell 展开。
            PROVIDER_LINE='<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>'
            sed -i "s|</application>|${PROVIDER_LINE}</application>|" "$MANIFEST"
          fi
          grep -qF 'androidx.core.content.FileProvider' "$MANIFEST" || { echo "::error::failed to inject FileProvider"; exit 1; }
          echo "✅ FileProvider present"

      - name: Copy custom Android icons
        run: |
          ICONS_SRC="src-tauri/icons/android"
          RES_DST="src-tauri/gen/android/app/src/main/res"
          if [ -d "$ICONS_SRC" ]; then
            for density in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              if [ -d "$ICONS_SRC/$density" ]; then
                mkdir -p "$RES_DST/$density"
                cp -f "$ICONS_SRC/$density/"* "$RES_DST/$density/"
              fi
            done
            if [ -d "$ICONS_SRC/mipmap-anydpi-v26" ]; then
              mkdir -p "$RES_DST/mipmap-anydpi-v26"
              cp -f "$ICONS_SRC/mipmap-anydpi-v26/"* "$RES_DST/mipmap-anydpi-v26/"
            fi
            if [ -f "$ICONS_SRC/values/ic_launcher_background.xml" ]; then
              mkdir -p "$RES_DST/values"
              cp -f "$ICONS_SRC/values/ic_launcher_background.xml" "$RES_DST/values/"
            fi
            rm -f "$RES_DST/drawable-v24/ic_launcher_foreground.xml"
            rm -f "$RES_DST/drawable/ic_launcher_background.xml"
            echo "✅ Custom Android icons copied from $ICONS_SRC"
          else
            echo "⚠️ No custom Android icons found at $ICONS_SRC, using defaults"
          fi

      # pdfium .so 已被 git 跟踪（4,971,128 字节），走 if 真分支，无网络依赖。
      # else 分支保留作兜底。
      - name: Bundle pdfium for Android
        run: |
          JNILIBS_DIR="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNILIBS_DIR"
          if [ -f "src-tauri/resources/pdfium/libpdfium_android_arm64.so" ]; then
            cp src-tauri/resources/pdfium/libpdfium_android_arm64.so "$JNILIBS_DIR/libpdfium.so"
            echo "✅ Bundled pdfium for arm64: $(du -h --apparent-size "$JNILIBS_DIR/libpdfium.so" | cut -f1)"
          else
            echo "⚠️ Android pdfium .so not found, downloading..."
            bash scripts/download-pdfium.sh android-arm64
            cp src-tauri/resources/pdfium/libpdfium_android_arm64.so "$JNILIBS_DIR/libpdfium.so"
            echo "✅ Downloaded and bundled pdfium for arm64"
          fi

      # ── NDK 工具链：相对上游 :365-379 的两处修正 ──
      # 1. 宿主 tag 由 uname 动态解析（上游硬编码 linux-x86_64）。仓库自身
      #    的 scripts/android-ndk-tools.sh 已有正确实现，这里内联等价逻辑。
      # 2. 校验 ELF 架构（上游 test -x 只看可执行位，不校验 e_machine）。
      # API 级别取 24，与上游 reusable-build-android.yml:368 及 Gradle
      # minSdk=24 三方对齐。此前误用 API 21 导致 run 37092196261 失败：
      # NDK r29 已不再提供 android21 的 clang 驱动（LLVM 已 drop pre-23
      # workaround），bin/ 下无 aarch64-linux-android21-clang，test -x 失败。
      - name: Configure NDK toolchain
        run: |
          HOST_ARCH="$(uname -m)"
          case "$HOST_ARCH" in
            x86_64|amd64)   NDK_HOST_TAG=linux-x86_64 ;;
            aarch64|arm64)  NDK_HOST_TAG=linux-aarch64 ;;
            *) echo "::error::unsupported runner architecture: ${HOST_ARCH}"; exit 1 ;;
          esac

          NDK_PREBUILT="${NDK_HOME}/toolchains/llvm/prebuilt/${NDK_HOST_TAG}"
          test -d "$NDK_PREBUILT" \
            || { echo "::error::NDK prebuilt toolchain missing: $NDK_PREBUILT (host=${HOST_ARCH})"; exit 1; }

          for TOOL in aarch64-linux-android24-clang aarch64-linux-android24-clang++ llvm-ar; do
            BIN="${NDK_PREBUILT}/bin/${TOOL}"
            test -x "$BIN" || { echo "::error::missing NDK tool ${TOOL} at ${BIN}"; exit 1; }
            # 必须是普通文件：NDK 新版 bin/ 下可能混入同名目录/符号链接，
            # test -x 对目录返回真，会把目录当 ELF 解析并产出空架构，故显式挡住。
            test -f "$BIN" || { echo "::error::NDK tool ${TOOL} is not a regular file at ${BIN}"; exit 1; }
            # llvm-ar 是多调用二进制，架构校验只对 clang 驱动有意义；但三者
            # 都必须是宿主可执行的 ELF，故统一校验 e_machine 与宿主一致。
            MACHINE="$(readelf -h "$BIN" 2>/dev/null | awk -F: '/Machine:/ {gsub(/^[ \t]+/,"",$2); print $2}')"
            case "${HOST_ARCH}:${MACHINE}" in
              x86_64:*)  case "$MACHINE" in *X86-64*) ;; *) echo "::error::${TOOL} is not an x86-64 binary (Machine=${MACHINE:-unknown})"; exit 1 ;; esac ;;
              aarch64:*) case "$MACHINE" in *AArch64*) ;; *) echo "::error::${TOOL} is not an AArch64 binary (Machine=${MACHINE:-unknown})"; exit 1 ;; esac ;;
            esac
          done

          {
            echo "CC_aarch64_linux_android=${NDK_PREBUILT}/bin/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=${NDK_PREBUILT}/bin/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=${NDK_PREBUILT}/bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_PREBUILT}/bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"

          echo "✅ NDK toolchain configured: ${NDK_PREBUILT} (host=${HOST_ARCH}, API=24)"

      # 与上游 :381-382 同源：复用 tauri 首次原生编译的产物，避免 Gradle 阶段
      # 二次编译 Rust。注意该脚本内部仍硬编码 linux-x86_64，与上面的动态解析
      # 存在理论不一致；ubuntu-22.04 托管 runner 恒为 x86_64，故当前安全。
      # 若将来迁到 arm64 runner，需同步修 scripts/ci/prepare-android-gradle.mjs:24。
      - name: Reuse Tauri's initial native build in the Gradle packaging phase
        run: node scripts/ci/prepare-android-gradle.mjs

      - name: Build Android APK
        env:
          SILICONFLOW_BUILTIN_TEXT_KEY: ${{ secrets.SILICONFLOW_BUILTIN_TEXT_KEY }}
          SILICONFLOW_BUILTIN_VISION_KEY: ${{ secrets.SILICONFLOW_BUILTIN_VISION_KEY }}
          SILICONFLOW_BUILTIN_EMBED_KEY: ${{ secrets.SILICONFLOW_BUILTIN_EMBED_KEY }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2048m
          DS_ANDROID_PREBUILT_NATIVE: '1'
        run: |
          set +e
          echo "Starting Android build with 165 minute timeout"
          # mobile-slim = ["sqlite","builtin_free_models","data_governance"]
          # 见 src-tauri/Cargo.toml:389。相对 default 裁掉 lance / mcp /
          # tokenizer_tiktoken / cloud_storage_s3——桌面向、编译负担最重的依赖树。
          #
          # 有意去掉上游的 --locked：lockfile 漂移与产物正确性无关，不应成为
          # 出包阻断点。cargo metadata 已在上方做过真实自洽校验。
          # 有意去掉上游的 with-resource-monitor.sh 包装：它只产出诊断日志，
          # 却额外依赖 setsid + /usr/bin/time，增加失败面。
          # 前端已由上方 "Build frontend (vite)" 步骤预构建，此处必须覆盖
          # beforeBuildCommand，否则 tauri 会再跑一次 tauri.conf.json 的
          # npm run build → prebuild(typecheck + licenses:check + vite build)，
          # 在 6144MB 堆与 Rust/Gradle 共享 runner 的前提下显著抬高 OOM 概率。
          # 但不能置空：tauri android build 在跑 hook 之前会先用 tauri.conf.json
          # 的静态 versionCode 重写 gen/android/app/tauri.properties，需靠 hook
          # 里的 version:generate 把生成器的稳定 versionCode 写回（同上游
          # reusable-build-android.yml:395-404 的处理）。
          timeout --signal=TERM --kill-after=60s 165m \
            npx tauri android build --target aarch64 --apk --ci \
              --config '{"build":{"beforeBuildCommand":"node scripts/generate-version.mjs"}}' \
              --features mobile-slim -- --no-default-features
          status=$?
          set -e

          if [ "$status" -eq 124 ]; then
            echo "::error::Android build timed out after 165 minutes"
          elif [ "$status" -ne 0 ]; then
            echo "::error::Android build failed with exit code ${status}"
          fi
          exit "$status"

      - name: Preserve unsigned APK before signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*-unsigned.apk
          compression-level: 0
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # 签名：优先用可选 secrets 里的正式 keystore；缺失则回退 --dev 自签。
      # 自签参数逐条复刻 scripts/build_android.sh:540-556。
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          test -x "${BUILD_TOOLS}/apksigner" || { echo "::error::apksigner not found"; exit 1; }

          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_PASSWORD}" ]; then
            echo "🔐 Using provided release keystore from secrets"
            echo "${KEYSTORE_BASE64}" | base64 -d > /tmp/release.keystore
            test -s /tmp/release.keystore || { echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty keystore"; exit 1; }
            SIGN_ALIAS="${KEY_ALIAS_SECRET:-aistudy}"
            SIGN_STORE_PASS="${KEYSTORE_PASSWORD}"
            SIGN_KEY_PASS="${KEY_PASSWORD}"
          else
            echo "🔓 No signing secrets configured — generating a self-signed dev keystore"
            echo "::notice::APK will be signed with a freshly generated dev keystore (alias aistudy-debug). It cannot upgrade-install over an official build; uninstall first."
            keytool -genkeypair \
              -v \
              -keystore /tmp/release.keystore \
              -alias aistudy-debug \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=AI Study Debug, OU=Development, O=AI Study, L=Beijing, ST=Beijing, C=CN"
            SIGN_ALIAS="aistudy-debug"
            SIGN_STORE_PASS="android"
            SIGN_KEY_PASS="android"
          fi

          UNSIGNED_APK=$(find src-tauri/gen/android -name "*-unsigned.apk" -type f | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::未找到未签名的 APK"
            find src-tauri/gen/android -name "*.apk" -type f || true
            exit 1
          fi
          echo "找到 APK: $UNSIGNED_APK"

          # extractNativeLibs=false 时未压缩 .so 需 16KB 页对齐（AGP 8.x 打包
          # 已满足，Android 15+ 16KB 页设备强制要求）。用 -P 16 显式对齐。
          "${BUILD_TOOLS}/zipalign" -P 16 -v 4 "$UNSIGNED_APK" /tmp/aligned.apk

          "${BUILD_TOOLS}/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass "pass:${SIGN_STORE_PASS}" \
            --key-pass "pass:${SIGN_KEY_PASS}" \
            --in /tmp/aligned.apk \
            --out /tmp/signed.apk

          "${BUILD_TOOLS}/apksigner" verify --print-certs /tmp/signed.apk

          # Android 8+ 需要该声明才能在应用内安装 APK。校验打包后的 manifest，
          # 而不只是生成的源 manifest。
          "${BUILD_TOOLS}/aapt" dump permissions /tmp/signed.apk > /tmp/apk-permissions.txt
          if ! grep -qF "android.permission.REQUEST_INSTALL_PACKAGES" /tmp/apk-permissions.txt; then
            echo "::error::APK is missing REQUEST_INSTALL_PACKAGES; in-app updates cannot request installation."
            exit 1
          fi
          echo "✅ REQUEST_INSTALL_PACKAGES present"

          # 发布守卫：opt-level=0 会产生约 330MB 的未优化 libdeep_student_lib.so，
          # 低内存设备启动 dlopen/重定位 OOM → APK 闪退（v0.9.43 线上事故）。
          # 超过阈值即失败。本工作流用 opt-level=z（正常约 116MB）。
          SO_SIZE=$(unzip -l /tmp/signed.apk | awk '/libdeep_student_lib\.so/ {print $1; exit}')
          echo "libdeep_student_lib.so size: ${SO_SIZE:-unknown} bytes (threshold: 250MB)"
          if [ -z "$SO_SIZE" ] || [ "$SO_SIZE" -gt 262144000 ]; then
            echo "::error::libdeep_student_lib.so is ${SO_SIZE:-missing} bytes — refusing to sign/publish."
            rm -f /tmp/release.keystore
            exit 1
          fi

          VERSION="${{ needs.resolve.outputs.version }}"
          mkdir -p android-output
          cp /tmp/signed.apk "android-output/Deep.Student_${VERSION}_arm64.apk"

          rm -f /tmp/release.keystore

          echo "✅ APK 签名完成: Deep.Student_${VERSION}_arm64.apk"
          ls -lh android-output/

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          overwrite: true
          name: android-arm64
          path: android-output/*.apk
          retention-days: 30
